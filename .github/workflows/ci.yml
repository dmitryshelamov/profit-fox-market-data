name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProfitFox.MarketData.sln

      - name: Build
        run: dotnet build ProfitFox.MarketData.sln --configuration Release --no-restore

      # dotnet format --verify-no-changes, but for the space between attributes the code style keeps: see the script.
      - name: Verify format
        run: sh ../scripts/verify-format.sh ProfitFox.MarketData.sln

      - name: Verify XML doc summaries
        run: |
          if grep -rnE --include='*.cs' '/// <summary>.+</summary>' src tests; then
            echo "One-line <summary>; write it on three lines."
            exit 1
          fi

      - name: Test
        run: >
          dotnet test ProfitFox.MarketData.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults
          if-no-files-found: ignore
