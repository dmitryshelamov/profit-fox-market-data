syntax = "proto3";

package profitfox.marketdata.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "ProfitFox.MarketData.Presentation.Protos";

// The funding payments of the catalog as the exchange makes them.
service FundingPaymentFeed {
  // Tells every funding payment once it is stored, as it is stored, until the caller ends the call. With `since`, the
  // stored ones of a time at or after it come first, oldest first, of every instrument, and the live ones follow with
  // none left out. One may come twice on the way from the stored ones to the live ones: the caller takes them as one,
  // by instrument and time. The response headers come once the subscription is in place.
  //
  // A live payment is one made since the service last looked: it looks half a minute after every whole hour, and a
  // payment comes within minutes of its time. The service asks the exchange for an instrument at a time, so the live
  // payments are not in the order of their times: those of one hour come minutes apart, and an instrument whose request
  // failed is asked again with the next hour, so its payment comes after newer ones of other instruments. A caller that
  // subscribes again therefore takes `since` hours before the newest payment it got, not at it, and takes the ones it
  // already has as one.
  //
  // What is stored as history is not told live: the pages a first loading brings, and, when the service was down for
  // more payments of an instrument than the exchange gives at once (200), all of them but the newest 200. A caller
  // asks for those with `since`, or with GET api/instruments/{id}/funding-payments.
  //
  // INVALID_ARGUMENT: `since` is further back than the service catches up.
  // RESOURCE_EXHAUSTED: the caller read slower than they came and is cut off; it subscribes again with `since`.
  // UNAVAILABLE: the service is stopping; the caller subscribes again with `since` once it is back.
  rpc Subscribe (SubscribeFundingPaymentRequest) returns (stream FundingPaymentUpdate);
}

message SubscribeFundingPaymentRequest {
  // Where to catch up from; absent means live ones only.
  google.protobuf.Timestamp since = 1;
}

// A funding payment. The rate is a decimal number as text, exactly as stored: "-0.00118658".
message FundingPaymentUpdate {
  // The id of the instrument in the catalog, as GET api/instruments gives it.
  string instrument_id = 1;
  google.protobuf.Timestamp time = 2;

  // The rate the exchange settled at the time, a fraction, not a percent. Below zero when the shorts paid the longs.
  string funding_rate = 3;
}