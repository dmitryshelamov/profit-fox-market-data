syntax = "proto3";

package profitfox.marketdata.v1;

import "google/protobuf/timestamp.proto";
import "candle_feed.proto";

option csharp_namespace = "ProfitFox.MarketData.Presentation.Protos";

// The long/short ratio of the catalog as it is loaded.
service LongShortRatioFeed {
  // Tells every new point of the long/short ratio once it is stored, as it is stored, until the caller ends the call.
  // With `since`, the stored ones of a time at or after it come first, oldest first, of every instrument, and the live
  // ones follow with none left out. One may come twice on the way from the stored ones to the live ones: the caller
  // takes them as one, by instrument and time. The response headers come once the subscription is in place.
  //
  // The exchange has no live source of the ratio: its points are loaded from its history, a contract a request, in a
  // round of the market about every five minutes. So the points of a contract come with the rounds, the five-minute
  // steps since the round before, and the contracts of a round come one after another. While the history of a contract
  // loads, its points come once an hour, in a batch of the steps of that hour.
  //
  // A live point is one loaded after the stored ones of its instrument. The history of an instrument, loaded back to
  // a year, is not told live. A caller that needs it subscribes again with `since`, or asks
  // GET api/instruments/{id}/long-short-ratio.
  //
  // INVALID_ARGUMENT: `since` is further back than the service catches up.
  // RESOURCE_EXHAUSTED: the caller read slower than they came and is cut off; it subscribes again with `since`.
  // UNAVAILABLE: the service is stopping; the caller subscribes again with `since` once it is back.
  rpc Subscribe (SubscribeLongShortRatioRequest) returns (stream LongShortRatioUpdate);

  // Tells the stored points of the long/short ratio over a window of past days, for backtests, and ends with OK. Only
  // what will not change is told: the part of the window where the series of the instrument is loaded from the history
  // of the exchange, and inside it every five-minute step the exchange has is stored; a spot pair, a share or a
  // contract the exchange tells no ratio of has none. Nothing is loaded from the exchange. Only instruments listed now
  // are read: a delisted one is left out, even when named, so the history is the one of the market as it is listed
  // today.
  //
  // The coverage comes first: one `InstrumentCoverage` for every instrument read, ordered by instrument id, with the
  // parts of the window it covers; an instrument with none gets an empty one. The points follow, by time and, within
  // one time, by instrument id, in an order that is the same on every read: the caller does not sort them. Read again,
  // a window that was covered both times gives the same messages in the same order; a caller that checks it by a hash
  // hashes the fields in the order they come, not the bytes of the messages, which protobuf does not keep the same.
  //
  // The service reads a few History calls at a time, those of every feed together; a call over that waits its turn
  // before anything comes, until the caller cancels it. A call over the whole market and years is read day by day as
  // the caller takes it: it takes long, not more memory.
  //
  // INVALID_ARGUMENT: the window does not end after it starts or ends after the start of the current UTC day; an
  // exchange is not one of `Exchange` or is EXCHANGE_UNSPECIFIED; an instrument id is not an id.
  // NOT_FOUND: an instrument id is not in the catalog.
  // UNAVAILABLE: the service is stopping; the caller reads again once it is back.
  rpc History (LongShortRatioHistoryRequest) returns (stream LongShortRatioHistoryItem);
}

message SubscribeLongShortRatioRequest {
  // Where to catch up from; absent means live ones only.
  google.protobuf.Timestamp since = 1;
}

// The long/short ratio of an instrument at a time: of the accounts that held a position in it, the share that was net
// long and the share that was net short. It counts accounts, not the size of their positions. A share is a decimal
// number as text, exactly as stored, a fraction and not a percent: "0.7302" is 73.02%.
message LongShortRatioUpdate {
  // The id of the instrument in the catalog, as GET api/instruments gives it.
  string instrument_id = 1;
  google.protobuf.Timestamp time = 2;

  // The share of the accounts that were net long.
  string long = 3;

  // The share of the accounts that were net short.
  string short = 4;
}

message LongShortRatioHistoryRequest {
  // The instruments to read, by their id in the catalog; none means every listed instrument of the exchanges asked for.
  repeated string instrument_ids = 1;

  // The exchanges whose instruments are read when none are named; none means all.
  repeated Exchange exchanges = 2;

  // Where the window starts, inclusive.
  google.protobuf.Timestamp from = 3;

  // Where the window ends, exclusive; not after the start of the current UTC day.
  google.protobuf.Timestamp to = 4;
}

// What a call of LongShortRatioFeed.History tells: first the coverage of every instrument, then the points.
message LongShortRatioHistoryItem {
  oneof item {
    InstrumentCoverage coverage = 1;
    LongShortRatioUpdate point = 2;
  }
}
